<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software Engineer — Portfolio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;600;700&display=swap');
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#111;font-family:Inter,Arial,sans-serif}.hero{position:relative;isolation:isolate;min-height:680px;height:100svh;max-height:960px;overflow:hidden;background:#f8f5ef}.headline{position:absolute;z-index:-2;top:5%;left:50%;transform:translateX(-50%);margin:0;width:92%;text-align:center;font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:900;line-height:.89;letter-spacing:-.025em;font-size:clamp(78px,14.8vw,220px)}.headline span{display:block}.headline .outline{color:transparent;-webkit-text-stroke:2px #242424;font-weight:800;letter-spacing:.015em}.glow{position:absolute;z-index:-1;width:52%;height:70%;bottom:-14%;left:24%;background:radial-gradient(ellipse,#efba6c99 0%,#f4d39866 40%,transparent 70%);filter:blur(16px)}.portrait{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:43%;height:79%;display:flex;align-items:flex-end;justify-content:center}.portrait img{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 12px 14px #8d63351a)}.placeholder{width:100%;height:100%;}.name{position:absolute;right:8%;top:57%;font-size:clamp(13px,1.8vw,24px);font-weight:700;letter-spacing:-.04em}.portfolio{position:absolute;left:7.5%;bottom:9%;display:flex;flex-direction:column;align-items:center;gap:22px}.arrow{width:55px;height:65px}.button{display:inline-block;padding:15px 32px;color:#fff;background:#141414;border-radius:40px;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;transition:transform .2s}.button:hover{transform:translateY(-3px)}.scribble{position:absolute;top:2%;left:-2%;width:24%;height:24%;z-index:-1;overflow:visible}.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ff9044,#e34c0b 63%,#ad2800);box-shadow:16px 23px 22px #38231319}.orb.one{width:62px;height:62px;top:5%;right:7%}.orb.two{width:38px;height:38px;bottom:30%;left:26%}.coil{position:absolute;right:-2%;bottom:-3%;width:29%;height:36%;z-index:-1;overflow:visible}.photo-control{position:absolute;right:25px;bottom:22px;cursor:pointer;font-size:11px;font-weight:600;background:#ffffffb8;border:1px solid #ddd3c7;padding:10px 15px;border-radius:30px}.photo-control:hover{background:white}.photo-control input{position:absolute;width:1px;height:1px;opacity:0}.photo-control:focus-within{outline:2px solid #eb5c16;outline-offset:3px}.hint{fill:#765e49;font:600 13px Inter,Arial,sans-serif}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:1500px){.hero{max-width:1800px;margin:auto}}@media(max-width:700px){.hero{min-height:640px;max-height:850px}.headline{top:13%;font-size:clamp(66px,18vw,125px);width:98%;line-height:.96}.headline .outline{-webkit-text-stroke:1.2px #242424}.portrait{width:84%;height:66%;left:51%}.name{top:auto;bottom:22%;right:6%;font-size:13px;background:#f8f5efcc;padding:8px;border-radius:4px}.portfolio{left:6%;bottom:7%;gap:14px}.button{padding:12px 21px;font-size:11px}.arrow{height:45px;width:40px}.orb.one{width:38px;height:38px;right:7%;top:5%}.orb.two{width:24px;height:24px;left:8%;bottom:38%}.scribble{width:32%;height:15%;top:0}.coil{width:43%;height:27%;bottom:3%;right:-10%}.photo-control{right:16px;bottom:16px;font-size:10px}}
</style>
</head>
<body>
<!-- SECTION HEADER: salin section dan CSS ini ke halaman Anda. -->
<section class="hero" aria-label="Header portfolio software engineer">
<h1 class="headline"><span>SOFTWARE</span><span class="outline">ENGINEER</span></h1>
<div class="glow" aria-hidden="true"></div>
<svg class="scribble" viewBox="0 0 250 160" aria-hidden="true"><defs><linearGradient id="orange" x2="0" y2="1"><stop stop-color="#ff9646"/><stop offset=".5" stop-color="#eb5c14"/><stop offset="1" stop-color="#bf3406"/></linearGradient></defs><path d="M-10 80 C20 15 50 -5 60 72 S85 125 110 70 S147 30 155 87 S187 140 219 95" fill="none" stroke="url(#orange)" stroke-width="17" stroke-linecap="round"/></svg>
<div class="orb one" aria-hidden="true"></div><div class="orb two" aria-hidden="true"></div>
<div class="portrait">
<!-- Ganti src dengan foto Anda. PNG transparan menghasilkan tampilan terbaik. -->
<img id="profile-photo" src="foto.png" alt="Foto profil" onerror="this.hidden=true;document.getElementById('photo-placeholder').hidden=false">
<svg id="photo-placeholder" class="placeholder" hidden viewBox="0 0 450 560" role="img" aria-label="Tempat foto profil Anda"><defs><linearGradient id="shirt" x2="1" y2="1"><stop stop-color="#b47b49"/><stop offset="1" stop-color="#724325"/></linearGradient></defs><circle cx="225" cy="130" r="70" fill="#d8bda1"/><path d="M164 104 Q163 39 224 40 Q291 35 290 108 Q252 75 220 82 Q195 83 164 104" fill="#342d28"/><path d="M198 185 L198 220 L252 220 L252 184" fill="#d8bda1"/><path d="M75 560 L91 310 Q98 234 194 212 L225 242 L257 212 Q352 234 359 310 L378 560" fill="url(#shirt)"/><path d="M194 212 L225 242 L257 212 L247 269 L226 250 L205 269Z" fill="#eee8df"/><path d="M225 252 V365" stroke="#42362c" stroke-width="7"/><path d="M137 320 L125 555 M312 320 L326 555" stroke="#694022" stroke-width="3" opacity=".5"/><rect x="135" y="422" width="180" height="38" rx="19" fill="#f8f5efd9"/><text x="225" y="446" text-anchor="middle" class="hint">FOTO ANDA DI SINI</text></svg>
</div>
<p class="name">NAMA ANDA</p>
<div class="portfolio"><svg class="arrow" viewBox="0 0 55 65" aria-hidden="true"><path d="M26 3 L26 49 L9 32 L5 36 L28 60 L51 36 L47 32 L30 49 L30 3Z" fill="none" stroke="#777" stroke-width="1.6"/></svg><a class="button" href="#portfolio">PORTFOLIO</a></div>
<svg class="coil" viewBox="0 0 290 220" aria-hidden="true"><path d="M15 205 C108 183 182 126 161 80 C138 30 100 81 124 127 C156 185 232 134 216 73 C204 16 160 38 175 86 C191 143 268 154 275 97" fill="none" stroke="url(#orange)" stroke-width="25" stroke-linecap="round"/></svg>
<label class="photo-control">Ganti foto<input id="photo-upload" type="file" accept="image/*" aria-label="Pilih foto profil"></label>
</section>
<!-- Ubah href tombol portfolio ke ID section portfolio pada website Anda. -->
<script>
let photoUrl;
document.getElementById('photo-upload').addEventListener('change',function(){
 const file=this.files[0];if(!file)return;
 if(photoUrl)URL.revokeObjectURL(photoUrl);
 photoUrl=URL.createObjectURL(file);
 const photo=document.getElementById('profile-photo');
 photo.onload=()=>{photo.hidden=false;document.getElementById('photo-placeholder').hidden=true};
 photo.src=photoUrl;
});
</script>
</body>
</html>
